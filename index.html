<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="An offline workout log with set tracking, rest timers, history and next targets."
    />
    <title>My Fitness Tracker</title>
    <link rel="icon" href="./assets/icon-192.png" />
    <link rel="apple-touch-icon" href="./assets/icon-180.png" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <a class="skip" href="#content">Skip to workout</a>
    <header class="appbar">
      <div class="bar-inner">
        <a href="#today" class="brand"
          ><span class="brandmark" aria-hidden="true"></span><span>My Fitness Tracker</span></a
        >
        <nav aria-label="Main" id="nav"></nav>
        <div class="availability" id="availability" aria-live="polite">On device</div>
      </div>
    </header>
    <main id="content" tabindex="-1">
      <div id="banners" role="status"></div>
      <div id="page"><p>Opening workout…</p></div>
    </main>
    <footer><span>My Fitness Tracker</span><a href="#attribution">Attribution</a></footer>
    <div id="timer" hidden></div>
    <div id="toast" role="status"></div>
    <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-body"></div></dialog>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
